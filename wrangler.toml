# إعدادات نشر الـ Worker عبر Wrangler CLI
# (اختياري - إيلا بغيتي تنشر من الكمبيوتر بدل الداشبورد مباشرة)

name = "attendance-backup"
main = "worker.js"
compatibility_date = "2024-11-01"

# ربط الـ Worker بـ R2 Bucket
[[r2_buckets]]
binding = "BACKUP_BUCKET"          # كيفما هو مستعمل فـ worker.js (env.BACKUP_BUCKET)
bucket_name = "attendance-backups" # سمي البucket كيفما بغيتي، وخلقه فـ R2 قبل النشر

# ⚠️ المفتاح السري (CF_SECRET) ما كيتحطش هنا.
# بعد النشر، دير فالـ Terminal:
#   wrangler secret put CF_SECRET
# وادخل السر اللي بغيتي (مثلا: كود طويل عشوائي)
