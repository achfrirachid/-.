name = "talaba-proxy"
main = "worker.js"
compatibility_date = "2024-09-01"

# --- Bindings: عوضهم بالقيم الحقيقية ديالك من Cloudflare Dashboard ---
# Workers & Pages > talaba-proxy > Settings > Bindings

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_ME_D1_NAME"
database_id = "REPLACE_ME_D1_ID"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_ME_KV_ID"
